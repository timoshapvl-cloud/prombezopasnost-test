<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тест по промышленной безопасности</title>
<style>
:root{--bg:#0b1220;--card:#121e31;--muted:#9fb0c7;--text:#eef4ff;--accent:#58a6ff;--good:#27c281;--bad:#ff667a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#0b1220,#14253d);font:16px/1.5 system-ui,Segoe UI,Arial;color:var(--text);min-height:100vh}
main{max-width:900px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:clamp(25px,4vw,38px);margin:12px 0 4px}.sub{color:var(--muted);margin:0 0 22px}
.panel,.question{background:rgba(18,30,49,.96);border:1px solid #293b56;border-radius:18px;padding:22px;box-shadow:0 12px 35px #0003}
button,select{border:1px solid #3a5273;background:#203652;color:var(--text);padding:11px 16px;border-radius:11px;font-weight:650;cursor:pointer}
button.primary{background:var(--accent);color:#071426;border:0}button:disabled{opacity:.45;cursor:not-allowed}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.bar{height:8px;background:#263951;border-radius:9px;overflow:hidden;margin:15px 0}.fill{height:100%;background:var(--accent);width:0;transition:.2s}
.meta{color:var(--muted);font-size:14px}.question{margin-top:16px}.qtext{font-size:20px;font-weight:700;margin:0 0 18px}
.option{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border:1px solid #344a67;border-radius:12px;margin:10px 0;cursor:pointer;background:#17263b}
.option:hover{border-color:var(--accent)}.option input{margin-top:5px;accent-color:var(--accent)}.option.correct{border-color:var(--good);background:#12382f}.option.wrong{border-color:var(--bad);background:#3b202d}
.feedback{margin-top:14px;padding:13px;border-radius:12px;background:#0d1929;color:var(--muted);display:none}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.result{font-size:22px;font-weight:750}.small{font-size:13px;color:var(--muted)}.hidden{display:none}
@media(max-width:560px){main{padding:18px 12px}.panel,.question{padding:17px}.qtext{font-size:18px}}

/* Улучшенная адаптация для телефонов */
html { -webkit-text-size-adjust: 100%; }
button, select, input { font: inherit; }
button, select, .option { touch-action: manipulation; }
button { min-height: 48px; }
.option { min-height: 56px; }
@media (max-width: 600px) {
  body { font-size: 16px; background: #0b1220; }
  main {
    width: 100%; max-width: none;
    padding: max(14px, env(safe-area-inset-top)) 12px
             max(24px, env(safe-area-inset-bottom));
  }
  .top { align-items: flex-start; }
  h1 { font-size: 27px; line-height: 1.18; }
  .sub { font-size: 14px; margin-bottom: 16px; }
  .panel, .question {
    border-radius: 16px; padding: 16px;
    box-shadow: none;
  }
  .controls { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .controls label { display: block; width: 100%; }
  select { width: 100%; min-height: 48px; margin-top: 6px; }
  button { width: 100%; min-height: 50px; padding: 12px 14px; }
  .qtext { font-size: 19px; line-height: 1.4; overflow-wrap: anywhere; }
  .option {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 15px 13px; margin: 10px 0;
    border-radius: 14px; line-height: 1.45;
    font-size: 16px;
  }
  .option input {
    flex: 0 0 20px; width: 20px; height: 20px;
    margin: 2px 0 0; accent-color: var(--accent);
  }
  .actions { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .meta { font-size: 13px; }
  .bar { height: 9px; }
  .feedback { font-size: 15px; line-height: 1.45; overflow-wrap: anywhere; }
  .result { font-size: 21px; }
}
@media (max-width: 360px) {
  main { padding-left: 9px; padding-right: 9px; }
  .panel, .question { padding: 13px; }
  h1 { font-size: 24px; }
  .qtext { font-size: 18px; }
}

</style></head><body><main>
<div class="top"><div><div class="meta">Подготовка к проверке знаний</div><h1>Промышленная безопасность</h1><p class="sub">Тренировочный тест по вопросам из вашего файла</p></div><div class="meta" id="bankCount"></div></div>
<section class="panel" id="setup"><h2>Настройки теста</h2><p class="meta">Вопросы и правильные ответы взяты из загруженного документа. Варианты ответов формируются автоматически из других ответов этого же документа.</p>
<div class="controls"><label>Количество вопросов<br><select id="count"><option>10</option><option selected>20</option><option>30</option><option>50</option><option value="all">Все вопросы</option></select></label>
<label>Порядок<br><select id="order"><option value="random">Случайный</option><option value="original">По порядку файла</option></select></label></div>
<button class="primary" onclick="start()">Начать тест</button></section>
<section id="quiz" class="hidden"><div class="meta top"><span id="progress"></span><span id="scoreLive"></span></div><div class="bar"><div class="fill" id="fill"></div></div>
<div class="question"><p class="qtext" id="qtext"></p><div id="opts"></div><div class="feedback" id="feedback"></div>
<div class="actions"><button id="check" class="primary" onclick="checkAnswer()">Проверить ответ</button><button id="next" onclick="nextQuestion()" disabled>Следующий вопрос →</button></div></div></section>
<section class="panel hidden" id="result"><div class="result" id="resultTitle"></div><p id="resultText"></p><div class="controls"><button class="primary" onclick="start()">Пройти заново</button><button onclick="review()">Посмотреть ошибки</button></div><div id="errors"></div></section>
</main>
<script>
const BANK=[{"q": "«Инцидент» – это?", "a": "Отказ или повреждение технических устройств, применяемых на опасном производственном объекте, отклонение от параметров, обеспечивающих безопасность ведения технологического процесса, не приведшие к аварии;"}, {"q": "Автозаправочная станция (АЗС) это - ?", "a": "Технологический комплекс, оснащенный оборудованием, обеспечивающий хранение и розничную реализацию нефтепродуктов;"}, {"q": "Арматура, устанавливаемая на компрессоре, сосудах и нагнетательных трубопроводах должна обозначаться маркировкой на корпусе, в которой указывается?", "a": "Все ответы верны."}, {"q": "Сколько въездв устраивается на дамбу хвостохранилища?", "a": "Не менее двух въездов;"}, {"q": "В какой период обеспечивается контроль за возможным поступлением в воздух рабочей зоны вредных веществ с остронапленным механизмом действия?", "a": "Непрерывный контроль с сигнализацией о превышении предельно -  допустимой концентрации;"}, {"q": "Без чего не допускается эксплуатация технических устройств и технологических транспортных средств, являющихся источниками загрязнения воздуха опасными и вредными веществами, в производственных помещениях?", "a": "Без устройства аспирационных или вентиляционных систем;"}, {"q": "В какие сроки должны проводиться технический осмотр и очистка поверхностей нагрева от смолистых отложений котлов, работающих с высокотемпературными органическими теплоносителями?", "a": "Систематически, но не реже чем через 8000 часов работы котла;"}, {"q": "В какие сроки подлежат обследованию и ремонту технические устройства?", "a": "В сроки, предусмотренные нормативно-технической документацией (паспортами завода–изготовителя) и графиками планово–предупредительных ремонтов организации;"}, {"q": "В каких организациях осуществляется производственный контроль в области промышленной безопасности?", "a": "В организациях, эксплуатирующих опасные производственные объекты;"}, {"q": "В каких случаях не допускается принимать нефтепродукты…? -", "a": "Все ответы верны"}, {"q": "В каких случаях проводятся внеочередные осмотры зданий и сооружений?", "a": "После стихийных бедствий или аварий;"}, {"q": "В каких случаях сосуд должен быть немедленно остановлен?", "a": "Если давление в сосуде поднялось выше разрешенного и не снижается, несмотря на меры, принятые персоналом;"}, {"q": "В каких случаях устанавливаются мембранные предохранительные устройства?", "a": "В любом из перечисленных."}, {"q": "В каких целях создаются добровольные противопожарные формирования?", "a": "осуществления мероприятий по предупреждению и тушению степных пожаров, а также пожаров в организациях и населенных пунктах;"}, {"q": "В какой документ должны записываться результаты технического освидетельствования сосуда?", "a": "В паспорт сосуда;"}, {"q": "В какой период обеспечивается контроль за возможным поступлением в воздух рабочей зоны вредных веществ с остронаправленным механизмом действия?", "a": "непрерывный контроль с сигнализацией о превышении предельно -  допустимой концентрации;"}, {"q": "В какой период проверяются цапфы ковшей методом неразрушающего контроля?", "a": "Не реже одного раза в год"}, {"q": "В какой срок электромеханик, лифтер проходит повторную проверку знаний:", "a": "Не реже 1 раз в 12 месяцев"}, {"q": "В каком документе отмечается время и место установки и снятия заглушек?", "a": "технологическом журнале;"}, {"q": "В каком документе фиксируются действия по установке и снятию заглушек?", "a": "журнале приема и сдачи смены;"}, {"q": "В каком из приведенных случаев содорегенерационный котел должен быть переведен на сжигание вспомогательного топлива?", "a": "в случае выхода из строя всех перекачивающих насосов или дымососов, или всех вентиляторов;"}, {"q": "В каком из приведенных случаев содорегенерационный котел должен быть немедленно остановлен и отключен действиями защит или персоналом?", "a": "При течи плава помимо леток или через не плотности топки и невозможности ее устранения"}, {"q": "В каком режиме система управления обеспечивает работу печи?", "a": "как в ручном, так и в автоматическом режиме."}, {"q": "В каком случае выполнение обязанностей инженерно-технического работника, ответственного за содержание грузоподъемных механизмов в исправном состоянии, и лица, ответственного за безопасное производство работ кранами, возлагается на одного инженерно-технического работника:", "a": "если количество регистрируемых кранов не превышает трех единиц;"}, {"q": "В каком случае рабочая ветвь конвейера, расположенная в наклонной галерее, оборудуется ограждением со стороны прохода?", "a": "При угле наклона галерии 6 градусов и более"}, {"q": "В каком случае сосуд должен быть перерегистрирован в территориальном подразделении уполномоченного органа в области промышленной безопасности до пуска в работу?", "a": "при перестановке сосуда на новое место или передаче другому владельцу, при внесении изменений в схему включения сосуда;"}, {"q": "В лаборатории, где все работы, связанные с применением опасных и токсичных веществ, должны находиться?", "a": "не менее двух человек."}, {"q": "В проектах организации работ необходимо?", "a": "указывать лица, ответственные за соблюдение требований промышленной безопасности, меры по обеспечению безопасности при проведении ремонта, порядок и последовательность выполнения ремонтных работ"}, {"q": "В случае невозможности устройства настилов и подмостей при выполнении работ с лестниц на какой высоте рабочими используются предохранительные пояса со страховочными канатами?", "a": "более 1,3 м"}, {"q": "В случаях, когда инструментальными наблюдениями выявлены возрастающие или незатухающие во времени деформации отдельных участков дамб и плотин или их оснований, вызываются?", "a": "представители проектной организации для выяснения причин и разработки мероприятий, обеспечивающих безаварийную работу сооружения;"}, {"q": "В случаях, когда наблюдается подъем уровня воды в пьезометрах выше установленного проектной документацией отметки, выдается?", "a": "заключение проектной организации о допустимости и условиях дальнейшей эксплуатации дамбы;"}, {"q": "В течение какого срока  осуществляется постановка на учет, снятие с учета опасного технического устройства?", "a": "3 рабочих дней со дня подачи заявления;"}, {"q": "В целях безопасной эксплуатации систем газоснабжения владельцы или коммунальные службы при техническом обследовании подземных стальных газопроводов проверяют?", "a": "все перечисленное"}, {"q": "В целях обеспечения готовности к действиям по локализации и ликвидации последствий аварий на хвостохранилищах, организация, эксплуатирующая хвостохранилище, привлекает?", "a": "профессиональные военизированные аварийно-спасательные службы и формирования или создает объектовые профессиональные военизированные аварийно-спасательные службы и формирования;"}, {"q": "Вертикальные, цилиндрические стальные резервуары по вместимости подразделяют?", "a": "от 100 м3 до 50 000 м3;"}, {"q": "Вертикальные, цилиндрические стальные резервуары по конструкции подразделяют…?", "a": "все ответы верны."}, {"q": "Владелец лифта обеспечивает содержание в исправном состоянии и безопасную эксплуатацию лифта путем?", "a": "Все ответы верны"}, {"q": "Внеочередное полное техническое освидетельствование грузоподъемным кранам проводится после:", "a": "установки сменного стрелового оборудования или замены стрелы;"}, {"q": "Внутренние газопроводы и газовое оборудование промышленных установок подвергаются техническому обслуживанию?", "a": "не реже 1 раза в месяц"}, {"q": "Воздухосборник или газосборник должен устанавливаться?", "a": "на фундамент вне здания компрессорной станции и должен быть огражден;"}, {"q": "Воздушные фильтры должны проверяться в сроки, предусмотренные руководством по эксплуатации компрессорной установки. Значение сопротивления проходу воздуха в фильтре должна быть?", "a": "не более 50 мм водяного столба, если иная величина не указана изготовителем."}, {"q": "Время выдержки трубопровода и его элементов под пробным давлением должно быть?", "a": "не менее 1 ботников проходит подготовку по  вопросам промышленной безопасности ежегодно с предварительным обучением по программе продолжительностью не менее десяти часов?", "a": "работники, выполняющие работы на опасных производственных объектах."}, {"q": "Какая объемная доля кислорода должна быть перед началом ремонта внутри кожуха блока разделения воздуха?", "a": "19-23%"}, {"q": "Какая сталь применяется для сооружения резервуара?", "a": "листовая;"}, {"q": "Какие данные выбиваются на хвостовике каждой заглушки…?", "a": "номер заглушки и давление на которое она рассчитана;"}, {"q": "Какие защитные приспособления должны быть предусмотрены на дробилках?", "a": "для конусных дробилок - глухие съемные ограждения, кроме дробилок крупного дробления 1 стадии, работающих «под завалом»; Для щековых дробилок – глухие боковые ограждения высотой не менее 1 м с козырьками"}, {"q": "Какие материалы не допускается оставлять во внутренних полостях аппаратов, трубопроводов применявшиеся при ремонте?", "a": "все ответы верны."}, {"q": "Какие надписи наносятся на газопроводах котельных, газорегуляторных пунктах, стационарных газозаправочных станциях?", "a": "направление движения потока газа"}, {"q": "Какие обязанности имеют физические лица в сфере гражданской защиты?", "a": "все ответы верны."}, {"q": "Какие опасные технические устройства относятся к опасным производственным объектам?", "a": "все ответы верны."}, {"q": "Какие подъемники оборудуются прибором безопасности – анемометром?", "a": "с высотой подъема от 22 метров."}, {"q": "Какие предприятия подлежат обязательному декларированию промышленной безопасности?", "a": "опасные производственные объекты, соответствующие критериям отнесения опасных производственных объектов к декларируемым, утвержденным уполномоченным органом в области промышленной безопасности."}, {"q": "Какие приспособления должны устанавливаться для удобного и безопасного обслуживания котлов, пароперегревателей и экономайзеров?", "a": "постоянные площадки и лестницы с перилами высотой не менее 0,9 м и сплошной обшивкой по низу не менее 200 мм."}, {"q": "Какие противогазы используются при ремонтных и аварийных работахc вредными веществами 1-го и 2-го классов опасности?", "a": "противогазы ПШ-1, ПШ-2"}, {"q": "Какие резервуары имеют плоские, конические и сферические днища, а также днища в форме усеченного конуса…?", "a": "горизонтальные;"}, {"q": "Какие светильники применяются для освещения при работе обслуживающего персонала внутри бака?", "a": "переносные светильники во взрывобезопасном исполнении, с напряжением не выше 12 Вольт."}, {"q": "Какие схемы вывешиваются непосредственно у агрегатов или мест нахождения обслуживающего персонала?", "a": "схемы расположения и технологической связи агрегатов и трубопроводов;"}, {"q": "Какие требование предъявляются к автотранспортным средствам при въезде на территорию резервную парка автотранспортных средств? Ответ", "a": "автотранспортные средства должны быть оборудованы искрогасительными устройствами и иметь допуск"}, {"q": "Какие требования безопасности необходимо применять в местах прохода и оборудования под ленточными конвейерами?", "a": "необходимо ограждение со сплошной обшивкой, исключающая возможность падения просыпщегося материала"}, {"q": "Какие трубопроводы регистрируются до пуска в работу в территориальном подразделении уполномоченного органа в области промышленной безопасности?", "a": "I категории с условным проходом более 70 мм, а также трубопроводы II и III категории с условным проходом более 100 мм;"}, {"q": "Каким должен быть порядок пуска технологического оборудования, машин и механизмов вработу, находящихся вне зоны видимости?", "a": "перед пуском оборудования в работу должен быть подан предупредительный звуковой сигнал продолжительностью не менее 10 с, после первого сигнала должна предусматриваться выдержка времени не менее 30 с, после чего должен подаваться второй сигнал продолжительностью 30 с"}, {"q": "Каким должен быть угол наклона лестниц к рабочим площадкам и механизмам, посещаемым 1-2 раза в смену, а также в зумпфах и колодцах?", "a": "к посещаемым 1-2 раза в смену - не более 600, в зумпфах и колодцах - до 900"}, {"q": "Какими документами необходимо руководствоваться при эксплуатации оборудования?", "a": "эксплуатацию оборудования необходимо проводить с соблюдением технологического регламента"}, {"q": "Каков объем резервуаров при котором не допускается изготавливать и монтировать их методом рулонной сборки?", "a": "свыше 20 000 м3;"}, {"q": "Какова периодичность проверки электроинструмента и вспомогательного оборудования к нему (трансформаторы, преобразователи частоты, защитно-отключающие устройства, кабели - удлинители)?", "a": "не реже 1 раза в 6 месяцев."}, {"q": "Какова предельная вместимость резервуаров, изготавливаемых с плоскими днищами?", "a": "до 8 м3."}, {"q": "Какова продолжительность работы в противогазе без перерыва в загазованной среде?", "a": "Не более 15 минут"}, {"q": "Каково минимальное количество рабочих при проведении сливоналивных операций?", "a": "два человека;"}, {"q": "Какое максимальное рабочее давление СНГ после регулятора резервуарных и групповых баллонных установок?", "a": "не превышает 400 даПа (400 мм вод. ст.)"}, {"q": "Какое минимальное количество рабочих должно быть в бригаде при работах вбункере?", "a": "не менее трех человек, двое из которых должны находиться в надбункерной части"}, {"q": "Какое напряжение должно быть у переносных ламп, применяемых внутри бункера для освещения во время проведения ремонтных работ?", "a": "не выше 12 В"}, {"q": "Какое содержание кислорода должно быть что бы обеспечить безопасный допуск работников в резервную для сбора и удаления остатков нефтепродукта? Ответ-", "a": "Не менее 20% (по объему)"}, {"q": "Какое содержание кислорода должно быть, чтобы обеспечить безопасный допуск работников в резервуар для сбора и удаления остатков нефтепродуктов?", "a": "Не менне 20% (объему)"}, {"q": "Какой вентиляцией оснащаются помещения, в которых проводится обезжиривание и хранение растворителей…?", "a": "приточно-вытяжной вентиляцией;"}, {"q": "Какой документ составляется в каждой организации, производящей и потребляющей продукты разделения воздуха?", "a": "план ликвидации аварий;"}, {"q": "Какой документ составляется изготовителем на каждый водоохлаждаемый элемент металлургических агрегатов?", "a": "паспорт."}, {"q": "Какой документ составляется на каждый наружный газопровод, электрозащитную, резервуарную и групповую баллонную установку, ГРП (газорегуляторные установки), ГНС, ГНП, АГЗС?", "a": "эксплуатационный паспорт, содержащий основные технические характеристики, а также данные о проведенных ремонтах"}, {"q": "Какой документ является результатом проведения экспертизы промышленной безопасности?", "a": "экспертное заключение;"}, {"q": "Какой организацией должны выбираться тип арматуры, ее количество и места установки?", "a": "организацией, проектирующей котел;"}, {"q": "Какой срок действия аттестата на право проведения работ в области промышленной безопасности?", "a": "5 лет;"}, {"q": "Какой устанавливается предупреждающий плакат устанавливается в период ремонта арматуры на сбросе газа из блока в атмосферу?", "a": "\"Не закрывать, работают люди!\";"}, {"q": "Капитальные и текущие ремонты основного оборудования?", "a": "производятся по разработанным и утвержденным проектам организации работ"}, {"q": "Кем выполняется Разработка дубликата паспорта? –", "a": "специализированной экспертной организацией"}, {"q": "Кем корректируется срок эксплуатации хвостохранилища или его очереди для своевременной подготовки дополнительной емкости, в случае превышения проектного графика заполнения хвостохранилища?", "a": "проектной организацией;"}, {"q": "Кем осуществляется руководство гражданской обороной?", "a": "Премьер-Министр Республики Казахстан;"}, {"q": "Кем оформляется запись в паспорте лифта, разрешающая ввод лифта в эксплуатацию после ремонта, требующего полного или частичного технического освидетельствования?", "a": "Лицом, ответственным за организацию работ по техническому обслуживанию и ремонту лифта"}, {"q": "Кем оформляется запись, разрешающая пуск в работу грузоподъемного крана?", "a": "инспектором по государственному надзору в области промышленной безопасности на основании положительных результатов полного технического освидетельствования крана, проведенного владельцем;"}, {"q": "Кем производится ежемесячный осмотр взрывозащитного оборудования в газовом хозяйстве предприятия?", "a": "лицом, ответственным за электрохозяйство"}, {"q": "Кем разрабатывается положение о производственном контроле на ОПО?", "a": "организацией их эксплуатирующей."}, {"q": "Кем утверждается декларация промышленной безопасности опасного производственного объекта?", "a": "руководителем организации, эксплуатирующей опасный производственный объект;"}, {"q": "Кем утверждается план ликвидации аварий?", "a": "Руководителем организации, эксплуатирующей опасный производственный объект"}, {"q": "Кем утверждаются акты инструментальной проверки эффективности работы аспирационных систем?", "a": "техническим руководителем организации;"}, {"q": "Кем утверждаются графики предусматривающие регулярные профилактические осмотры и ремонт оборудования на предприятиях в срок?", "a": "техническим руководителем"}, {"q": "Когда включаются местные вытяжные установки до начала работы технологического оборудования?", "a": "за 3 - 5 минут"}, {"q": "Когда и с какой периодичностью производится инструментальная проверка эффективности работы аспирационных систем?", "a": "не реже одного раза в год, после капитального ремонта или реконструкции;"}, {"q": "Когда пересматривается положение о производственном контроле?", "a": "при изменении Закона, изменениях технологического процесса на ОПО по решению технического руководителя организации, эксплуатирующей ОПО."}, {"q": "Компрессор и его двигатель устанавливаются?", "a": "на фундаментах, не связанных со стенами здания."}, {"q": "Компрессорные установки должны быть обеспечены системой водяного или воздушного охлаждения с соблюдением режима работы системы соответствующей?", "a": "руководству по эксплуатации изготовителя;"}, {"q": "Конструкция сосудов обеспечивает эксплуатацию в течение…?", "a": "нормативного срока службы."}, {"q": "Контейнеры загружаются шарами до уровня?", "a": "на 100 мм ниже бортов"}, {"q": "Кто в обязательном порядке должен участвовать в приемочных испытаниях, технических освидетельствованиях, проводимых организацией, при вводе в эксплуатацию опасного производственного объекта?", "a": "государственный инспектор;"}, {"q": "Кто зачисляется в формирования гражданской защиты?", "a": "трудоспособные мужчины и женщины, за исключением инвалидов первой, второй и третьей групп, беременных женщин, женщин, имеющих детей в возрасте до восьми лет, и на военное время - военнообязанных, имеющих мобилизационные предписания;"}, {"q": "Кто и на основании чего принимает решение о пуске в работу котла?", "a": "технический руководитель организации - письменным распоряжением после проверки готовности оборудования котельной установки к эксплуатации и организации его обслуживания."}, {"q": "Кто осуществляет координацию деятельности аварийно-спасательных служб и формирований, а также негосударственных противопожарных служб?", "a": "уполномоченный орган;"}, {"q": "Кто устанавливает периодичность проверки работоспособности блокировок безопасности, систем сигнализации, противопожарной защиты технических устройств и порядок оформления результатов проверки?", "a": "организация."}, {"q": "Кто является уполномоченным органом в области промышленной безопасности?", "a": "центральный исполнительный орган, осуществляющий руководство и межотраслевую координацию, разработку и реализацию государственной политики в области промышленной безопасности."}, {"q": "Легковоспламеняющиеся и горючие жидкости доставляют со складов в лабораторию в?", "a": "закрытой небьющейся посуде или в стеклянной посуде, помещенной в футляр."}, {"q": "Лестницы устанавливаются под углом?", "a": "не более 50о к горизонтали;"}, {"q": "Лица, не состоящие в штате, но находящиеся на территории опасного производственного объекта с целью выполнения производственных заданий?", "a": "подлежат инструктажу о мерах безопасности с занесением в журнал проведения инструктажа и обеспечению средствами индивидуальной защиты"}, {"q": "Масляный насос и лубрикатор должны очищаться?", "a": "не реже одного раза в полтора месяца;"}, {"q": "Материалы (трубы, патрубки, гнутые элементы (отводы), компенсаторы, фланцы, заглушки, прокладки, арматура, электроды, сварочная проволока, болты, шпильки, гайки и тому подобное), методы и объем контроля сварных соединений, применяемые при монтаже и ремонте трубопроводов компрессорных станций должны определяться?", "a": "проектом;"}, {"q": "Действия при отравлении аммиаком?", "a": "пострадавшего выводят на чистый воздух, дают ему вдыхать кислород и вызывают скорую медицинскую помощь. При легком отравлении пострадавшему давать теплое молоко с содой."}, {"q": "Мероприятия по безопасному пропуску паводка выполняются не позднее?", "a": "15 календарных дней до предполагаемого паводка;"}, {"q": "Механизмы подъема груза каких кранов оборудуются двумя тормозами:", "a": "грузоподъемных кранов, транспортирующих расплавленный металл и шлак, ядовитые или взрывчатые вещества;"}, {"q": "Монтаж и ремонт компрессорных станций выполняется в соответствии с?", "a": "инструкциями по монтажу, ремонту и эксплуатацией изготовителя"}, {"q": "монтажа и ремонта трубопроводов?", "a": "в проектно-конструкторской документации;"}, {"q": "На грейфере устанавливается табличка с указанием:", "a": "предприятия-изготовителя, номера, объема, собственной массы, вида материала, для перевалки которого он предназначен и наибольшей допустимой массы зачерпнутого материала;"}, {"q": "На какое внутреннее давление рассчитаны горизонтальные резервуары?", "a": "до 0,04 МПа;"}, {"q": "На каком расстоянии от печей устанавливаются расходные баки с мазутом?", "a": "не менее 5 метров от печей и защищаются экранами от нагревания теплоизлучением;"}, {"q": "На каком расстоянии от сливоналивной эстакады они освещаются прожекторами:", "a": "не менее 20 метров"}, {"q": "На каком сосуде установка манометра и предохранительного клапана не требуется?", "a": "на сосуде, у которого разрешенное давление равно или больше давления питающего источника в сосуде и при условии исключения возможности повышения давления от химической реакции или обогрева;"}, {"q": "На кого возлагается обеспечение подготовки, переподготовки специалистов, работников аттестованных, проектных организаций и иных организаций, привлекаемых для работы на опасных производственных объектах, по вопросам промышленной безопасности?", "a": "на руководителей организаций, эксплуатирующих опасные производственные объекты;"}, {"q": "На кого возлагается ответственность за хранение, состояние и правильность ведения агрегатных журналов?", "a": "на механика цеха;"}, {"q": "На объектах, требующих круглосуточного обслуживания, применяется электрическая система с изолированной нейтралью при линейном напряжении?", "a": "не выше 320 Вольт;"}, {"q": "На опасных производственных объектах лица, осуществляющие производственный контроль промышленной безопасности имеют право?", "a": "вносить руководителю организации предложения о привлечении к ответственности работников ОПО, нарушивших требования промышленной безопасности."}, {"q": "На основании чего проводятся огневые работы на ГНС, ГНП, АГЗС?", "a": "проводятся по специальному плану, утвержденному руководителем предприятия, и наряду-допуску"}, {"q": "На основном посадочном (погрузочном) этаже вывешивается табличка с указанием:", "a": "наименования лифта ( по назначению), грузоподъемности(с указанием допустимого числа пассажиров), учетного (регистрационного номера), номер телефона для связи с обслуживающим персоналом или с аварийной службой."}, {"q": "На применение каких технологий, технических устройств материалов, применяемых на опасных производственных объектах, опасных технических устройств не требуется разрешение уполномоченного органа в области промышленной безопасности?", "a": "на применение узлов, деталей, приборов, комплектующих изделий, запасных частей, входящих в состав технических устройств, а также на технические устройства, прошедшие процедуру подтверждения соответствия (сертификацию);"}, {"q": "На стенах в пределах ремонтных площадок вывешиваются?", "a": "схемы строповки основного оборудования и грузов."}, {"q": "На территории предприятия вдоль трассы подземного газопровода с обеих сторон выделяются полосы, в пределах которых не допускается складирование материалов и оборудования. Полосы должны быть шириной?", "a": "2,0 м."}, {"q": "На что опирается понтон в нижнем положении?", "a": "Наливные эскакады освещаются прожекторами кототрые устанавливаются –"}, {"q": "Находящиеся в работе грузоподъемные краны снабжаются:", "a": "табличками с ясно обозначенным учетным (регистрационным) номером, грузоподъемностью и датой следующего частичного или полного технического освидетельствования."}, {"q": "Не допускается колебание давления газа на выходе из ГРП или газорегуляторных установок, превышающее?", "a": "10% рабочего давления"}, {"q": "Не допускается установка манометров на высоте?", "a": "более 3 метров от уровня площадки наблюдения;"}, {"q": "Не допускаются к применению средства измерения, у которых?", "a": "отсутствуют пломба или клеймо, просрочен срок поверки, имеются повреждения, стрелка при отключении не возвращается к нулевому делению шкалы на величину, превышающей половину допускаемой погрешности для данного прибора"}, {"q": "Оборудование диспетчерского контроля за работой лифтов после монтажа, реконструкции и периодически при эксплуатации подвергается проверке на функционирование в объеме, опеределенном?", "a": "Эксплуатационной документацией изготовителя"}, {"q": "Оборудование диспетчерского контроля за работой лифтов после реконструкции периодически при эксплуатации подвергается на функционирование в объеме определённом?", "a": "эксплуатационной документацией изготовителя."}, {"q": "Обход наружных надземных и подземных газопроводов проводится не реже?", "a": "одного раза в 3 месяца"}, {"q": "Общегосударственный комплекс мероприятий, проводимых в мирное и военное время, направленных на предупреждение и ликвидацию чрезвычайных ситуаций природного и техногенного характера и их последствий, организацию и ведение гражданской обороны, оказание экстренной медицинской и психологической помощи населению, находящемуся в зоне чрезвычайной ситуации, включающий в себя мероприятия по обеспечению пожарной и промышленной безопасности, формированию, хранению и использованию государственного материальногорезерва – это понятие?", "a": "гражданской защиты;"}, {"q": "Общий запас одновременно хранящихся в каждом рабочем помещении лаборатории огнеопасных жидкостей держат?", "a": "не выше суточной потребности этих жидкостей."}, {"q": "Объемная доля кислорода в воздухе помещений составляет…?", "a": "не менее 19% и не более 23%;"}, {"q": "Опасные технические устройства – это?", "a": "технические устройства, работающие под давлением более 0,07 мега Паскаля или при температуре нагрева воды более 115 градусов Цельсия, грузоподъемные механизмы, эскалаторы, фуникулеры, лифты, эксплуатируемые на опасных производственных объектах, надзор за которыми осуществляется уполномоченным органом в области промышленной безопасности;"}, {"q": "Организация, эксплуатирующая хвостохранилище, создает паводковую комиссию?", "a": "не позднее, чем за месяц до начала половодья или ливневых паводков;"}, {"q": "Осмотр и ремонт водозаборных и водосбросных сооружений осуществляется?", "a": "по наряду-допуску"}, {"q": "Осмотр, ремонт и окраска плавучих насосных станций, понтонов производится не реже?", "a": "одного раза в три года;"}, {"q": "Основными задачами гражданской защиты являются?", "a": "все ответы верны."}, {"q": "Остановка оборудования, агрегатов, аппаратов и коммуникаций для внутреннего осмотра, очистки и ремонта и его пуск производятся в соответствии?", "a": "с технологическим регламентом"}, {"q": "Ответственность за нарушение законодательства Республики Казахстан о гражданской защите установливается?", "a": "Установленную законами Республики Казахстан"}, {"q": "Оформление какого документа требуется при выполнении ремонтных работ в сосуде, где находятся остатки жидких продуктов разделения возхдуха?", "a": "наряд – допуск."}, {"q": "Очистка системы охлаждения сжатого воздуха или инертного газа (рубашки цилиндров, концевой и промежуточные холодильники) от накипи, шлама и других загрязнений должна производиться?", "a": "по графику, утвержденному техническим руководителем, в зависимости от общей жесткости воды, подаваемой на охлаждение компрессорной установки;"}, {"q": "Паспорт, инструкция и другая эксплуатационная документация, поставляемая с грузоподъемным механизмом, представляется:", "a": "на государственном и русском языке;"}, {"q": "Перечень, каких средств измерения и автоматизации составляется в организации?", "a": "средства измерения и автоматизации, отказы которых могут привести к аварии или вызвать различные инциденты (отклонение от технологического режима, отказ или повреждение технического устройства);"}, {"q": "По какой из приведенных технологий должен проводиться ремонт с применением сварки (пайки) сосудов и их элементов, работающих под давлением?", "a": "разработанной изготовителем сосуда или ремонтной организацией;"}, {"q": "По какой из приведенных технологий должен проводиться ремонт с применением сварки(пайки) сосудов и их элементов, работающих под давлением?", "a": "Разработанной изготовителем сосуда или ремонтной организацией"}, {"q": "Под наблюдением какой службы находятся здания и сооружения опасных производственных объектов в процессе эксплуатации?", "a": "службы технического надзора;"}, {"q": "Подвеска аппаратов управления на грузоподъемном механизме осуществляется на высоте:", "a": "от 1000 до 1500 мм от уровня пола;"}, {"q": "Подлежат постановке на учет в территориальном подразделении уполномоченного органа в области промышленной безопасности:", "a": "краны-манипуляторы грузоподъемностью свыше 10 тонн."}, {"q": "Полное техническое освидетельствование редко используемым грузоподъемным кранам проводится:", "a": "не реже одного раза в 5 лет."}, {"q": "После монтажа и капитального ремонта до пуска в эксплуатацию магистральные напорные пульповоды, гидромеханическое оборудование испытывается?", "a": "на прочность и герметичность с составлением акта испытания;"}, {"q": "Постановка на учет в территориальном подразделении уполномоченного органа в области промышленной безопасности грузоподъемных механизмов производится:", "a": "по заявлению владельца и паспорту грузоподъемного механизма;"}, {"q": "потребляющей продукты разделения воздуха?", "a": "план ликвидации аварий;"}, {"q": "предохранительное устройство?", "a": "не допускается;"}, {"q": "При использовании вредных веществ каких классов опасности в закрытых помещениях предусматривается проведение технологических процессов с размещением оборудования в изолированных кабинах, помещениях или зонах с управлением этим оборудованием из пультов или операторских зон?", "a": "1-го и 2-го классов опасности в закрытых помещениях предусматривается проведение технологических процессов с размещением оборудования в изолированных кабинах, помещениях или зонах с управлением этим оборудованием из пультов или операторских зон."}, {"q": "При каких случаях не допускается эксплуатация технический устройств…?", "a": "все ответы верны."}, {"q": "При каких случаях прекращаются ремонтные работы…?", "a": "все ответы верны."}, {"q": "При какой температуре воздуха внутри нагретых технических устройств, допускается проведение ремонтных работ?", "a": "после проветривания и снижения температуры воздуха в них до 400С."}, {"q": "При какой температуре наружного воздуха не допускается переключение подачи пульпы с одного пульповода на другой во избежание разрыва стенок пульповода?", "a": "ниже минус 10ºС;"}, {"q": "При каком случае не допускается выгрузка перлитового песка из отсеков блока разделения воздуха…?", "a": "открытом сосуде;"}, {"q": "При каком угле наклонной галереи рабочая ветвь конвейера оборудуется ограждением со стороны прохода?", "a": "60 и более;"}, {"q": "При наружном и внутреннем осмотрах трубопровода, находившегося в нерабочем состоянии более 12 месяцев, проверяется?", "a": "все ответы верны."}, {"q": "При ограждении шахты металлическими листами, стальной лист применяется толщиной?", "a": "Не менее 1 мм"}, {"q": "При остановке приточных систем на воздуховодах обратные клапаны находятся?", "a": "в закрытом положении"}, {"q": "При отсутствии в проектной документации контролируемой длины надводного пляжа, она устанавливается?", "a": "в пределах 20 - 50 м, в зависимости от местных условий;"}, {"q": "При отсутствии скальной вскрыши наращивание высоты дамб в каскаде производится?", "a": "только в сторону низового откоса, совместно с наращиванием экрана;"}, {"q": "При применении вертикально-раздвижных дверей и кабины зазор между их створками, опущенными до совпадения их верхних кромок с уровнем загрузки, обеспечивается?", "a": "не более 50мм и не менее 15 мм"}, {"q": "При прокладке трубопроводов в полупроходных каналах высота каналов в свету предусматривается?", "a": "не менее 1,5 м;"}, {"q": "При установке в машинном помещении нескольких лебедок расстояние между неизолированными токоведущими частями НКУ (низковольтное комплектное устройство) одного лифта и лебедкой другого лифта должно быть?", "a": "менее 1200 мм"}, {"q": "Прибытие аварийной бригады на аварийный объект, устанавливается положением об аварийно-диспетчерской службе, но должно быть не позже:", "a": "40 минут"}, {"q": "Прием в эксплуатацию оборудования должен производиться комиссией, назначаемой:", "a": "руководителем организации"}, {"q": "Применение автоматических газоанализаторов с устройством сигнализации, периодичность отбора проб воздуха в помещении и на рабочих местах производимая согласно проектной документацией с учетом конкретных условий эксплуатации, видов технических устройств - это…?", "a": "контроль воздушной среды."}, {"q": "Промышленная безопасность – это?", "a": "состояние защищенности физических и юридических лиц, окружающей среды от вредного воздействия опасных производственных факторов;"}, {"q": "Пуск вентиляционных систем во взрывопожароопасных помещениях производится за?", "a": "15 мин. до начала работы технологического оборудования"}, {"q": "Пути обеспечения промышленной безопасности:", "a": "все ответы верны."}, {"q": "Работы по газовой резке, сварке и др. видам газопламенной обработки металлов допускаются на расстоянии (по горизонтали) не менее?", "a": "10 м – от групповых газобаллонных установок; 5 м – от отдельных баллонов с кислородом и горючими газами 3 м – от газопроводов и резинотканевых рукавов"}, {"q": "Работы, сопровождающиеся выделением вредных веществ, паров и газов, проводятся?", "a": "в вытяжных шкафах, обеспеченных канализацией, водопроводом и защитными устройствами."}, {"q": "Размещение компрессорных установок под бытовыми, офисными и подобными им помещениями?", "a": "не допускается;"}, {"q": "Разрешение на работу крана после ремонта выдается:", "a": "инженерно-техническим работником, ответственным за содержание грузоподъемных кранов в исправном состоянии, с записью в вахтенном журнале."}, {"q": "Расстояние от уровня чистого пола машинного помещения до низа балок, используемых для подвески грузоподъемного средства, предназначенного для проведения ремонтных работ?", "a": "Не менее 2000мм"}, {"q": "Расчет устойчивости крана производится:", "a": "во всех случаях."}, {"q": "Режим работы газорегуляторных пунктов и газорегуляторных установок промышленных и других предприятий, а также головных (промежуточных) ГРП устанавливается в соответствии с?", "a": "проектом"}, {"q": "Результаты лабораторного анализа масла должны оформляться?", "a": "на каждую емкость партии масла;"}, {"q": "Ремонтно-монтажные и такелажные работы выполняются в соответствии?", "a": "с технологическим регламентом"}, {"q": "Руководителем организации, ведущей переработку твердых полезных ископаемых, разрабатываются и утверждаются?", "a": "положение о производственном контроле, технологический регламент, план ликвидации аварий"}, {"q": "Рычажно-грузовые предохранительные клапаны устанавливаются?", "a": "на нагнетательной линии и воздухосборнике;"}, {"q": "С использованием какой системы транспорта осуществляется перегрузка перлитового песка из хранилищ в блоки разделения воздуха и обратно?", "a": "пневмотранспорта;"}, {"q": "С каким интервалом регулярно проверяется объемная доля кислорода во время нахождения персонала внутри трубопроводов, опорных обечаек регенераторов, в отсеке обратноповоротных клапанов или арматуры?", "a": "10 минут;"}, {"q": "С какой периодичностью проводится внешний осмотр средств пожаротушения, включая автоматические системы?", "a": "не реже 1 раза в месяц;"}, {"q": "С кем согласовывается внесение изменений в конструкцию технических устройств или в технологические схемы?", "a": "с проектировщиком, изготовителем оборудования;"}, {"q": "С учетом какого требования производится эксплуатация переносных сосудов жидких продуктов разделения воздуха?", "a": "завода изготовителей сосудов;"}, {"q": "Сведения о замене задвижек, кранов, компенсаторов на газопроводах, а также выполненных при капитальном ремонте работах заносятся?", "a": "в паспорт газопровода"}, {"q": "Сведения о ремонте и наладках вентиляционных систем фиксируются в?", "a": "паспорте вентиляционных систем"}, {"q": "Сколько времени хранятся наряды-допуски на газоопасные работы?", "a": "не менее 1 года"}, {"q": "Сколько въездов устраивается на дамбу хвостохранилища?", "a": "не менее двух въездов;"}, {"q": "Сколько манометров должно применяться для контроля давления воды при гидравлическом испытании котла?", "a": "два имеющие одинаковую класса точности не ниже 1,5"}, {"q": "Сколько раз в год и когда проводятся общие технические осмотры зданий?", "a": "два раза в год - весной и осенью."}, {"q": "Сколько спасательных кругов устанавливается на борту насосной станции?", "a": "не менее двух;"}, {"q": "Совместно с представителями каких организаций проводятся учебные тревоги и противоаварийные тренировки?", "a": "Совместно с предствителями территориального подразделения уполномоченного органа в области промышленной безопасности и представителями профессиональных аварийно-спасательных служб и формирований"}, {"q": "Состав, порядок и периодичность осмотров подводных частей хвостохранилища определяются?", "a": "проектом;"}, {"q": "Сосуды с каким внутренним диаметром должны иметь люки?", "a": "более 800 мм;"}, {"q": "Способ поддержания майны в зимний период или возможность работы без майны при эксплуатации плавучей насосной установки устанавливается?", "a": "технологическим регламентом."}, {"q": "Срабатывания устройств защиты, блокировок и сигнализации проводится?", "a": "не реже 1 раза в месяц, а также после окончания ремонта оборудования, если другие сроки не предусмотрены эксплуатационной документацией организаций-изготовителей"}, {"q": "Статическое испытание грузоподъемному крану проводится:", "a": "нагрузкой, на 25% превышающей его грузоподъемность;"}, {"q": "Комнаты, предназначенные для работ с высокоопасными веществами?", "a": "изолируются от остальных помещений лаборатории, имеют отдельный вход и вытяжные шкафы, не связанные с вентиляцией других помещений."}, {"q": "Строительство электролиний постоянного тока вблизи проложенных трубопроводов допускается?", "a": "по согласованию с проектной организацией;"}, {"q": "территориальное подразделение уполномоченного органа для постановки на учет трубопровода?", "a": "все перечисленные документы."}, {"q": "территориальное подразделение уполномоченного органа для постановки на учет трубопровода?", "a": "все перечисленные документы."}, {"q": "Территория нефтебазы ограждается продуваемой оградой из негорючих материалов высотой не менее…?", "a": "2 метров."}, {"q": "Техническое освидетельствование грузоподъемных кранов проводится:", "a": "инженерно-техническим работником по надзору за безопасной эксплуатацией грузоподъемных кранов при участии инженерно-технического работника, ответственного за содержание кранов в исправном состоянии."}, {"q": "Тренировочные занятия по планам локализации и ликвидации аварий по каждой теме, для каждой бригады проводятся не реже:", "a": "1 раза в 6 месяцев"}, {"q": "Трубопроводы прокладываются на расстоянии?", "a": "не менее 0,5 метров до электрокабелей, электропроводок и электрооборудования;"}, {"q": "Укажите неправильное требование при прокладке газопроводов в системах газоснабжения тепловых электростанций и котельных?", "a": "при прокладке по территории открытых распределительных устройств, складов топлива газопроводы должны ограждаться защитными конструкциями"}, {"q": "Укладка хвостов, перекачиваемых из аварийной емкости, в тело упорной призмы не допускается?", "a": "без согласования с проектной организацией;"}, {"q": "Уровень и вид защиты взрывозащищенного электрооборудования должен соответствовать?", "a": "категории взрывоопасной зоны;"}, {"q": "Установка воздухосборника, газосборника?", "a": "внутри здания не допускается"}, {"q": "Установки, эксплуатирующиеся на промышленных предприятиях оборудованные системой автоматизации, обеспечивающей безаварийную работу газового оборудования и противоаварийную защиту, подвергаются техническому обслуживанию?", "a": "не реже 1 раза в 3 месяца, а ремонту – 1 раз в год"}, {"q": "Устройства для централизованной подачи компрессорного масла (баки, насосы и прочие) должны размещаться?", "a": "в отдельном от машинного зала помещения, отделенном капитальными стенами и имеющем выход наружу;"}, {"q": "Химические лаборатории располагаются в помещениях с?", "a": "естественным и искусственным освещением, отоплением, водопроводом и канализацией."}, {"q": "Ходовые колеса кранов, передвигающихся по рельсовому пути и их опорных тележек снабжаются щитками, предотвращающими возможность попадания под колеса посторонних предметов. Зазор между щитком и рельсом:", "a": "не превышает 10 мм;"}, {"q": "Чем демонтируются или отключаются сосуды, требопроводы, арматуры и приборы исключаемые из технологической схемы?", "a": "заглушками;"}, {"q": "Чем не разрешается продувать резинотканевый рукав для горючих газов?", "a": "кислородом"}, {"q": "Чем определяется ширина и конструкция проезжей части дорог?", "a": "проектной документацией;"}, {"q": "Чем осуществляется замер уровней вредных и агрессивных сред,исключающих необходимость открывания люков аппаратов?", "a": "уровнемером"}, {"q": "Чем покрывается наружная поверхность оборудования и трубопроводов, работающих в агрессивной среде ?", "a": "покрывается антикоррозионным покрытием."}, {"q": "Чем покрывается откос основания?", "a": "несгораемым материалом;"}, {"q": "Чем продуваются перед ремонтом азотные турбодетандеры?", "a": "воздухом;"}, {"q": "Чем производится снаружи, отогрев трубопроводной арматуры?", "a": "все ответы верны."}, {"q": "Чем производится, отогрев смерзшейся изоляции?", "a": "сухим подогретым воздухом;"}, {"q": "Через какое время интенсивно вентилируется резервную и контролируется  содержание вредных паров и газов в нем во время работы по удалению осадка? Ответ –", "a": "через час"}, {"q": "Через какой промежуток времени производится анализ воздуха рабочей зоны в первые сутки при проведении ремонтных работ?", "a": "30 минут;"}, {"q": "Что вывешивается в помещении пульпонасоснойстанции?", "a": "общая схема насосного, энергетического оборудования станции, трубопроводов и их переключений с указанием стационарных номеров всех агрегатов и запорно-регулирующей арматуры;"}, {"q": "Что должен содержать план ликвидации аварий?", "a": "оперативная часть; распределение обязанностей между работниками, участвующими в ликвидации аварий, последовательность действий; список должностных лиц и учреждений, оповещаемых в случае аварии и участвующих в ее ликвидации."}, {"q": "Что должно соответствовать указаниям проекта на изготовление резервуара и подтверждаться сертификатами изготовителей?", "a": "качество и марка стали;"}, {"q": "Что из приведенного не указывается на специальной табличке сосуда, разрешенного в эксплуатацию?", "a": "число, месяц, год ввода в эксплуатацию сосуда;"}, {"q": "Что из приведенного не указывается на специальной табличке сосуда, разрешенного в эксплуатацию:", "a": "число, месяц, год ввода в эксплуатацию"}, {"q": "Что обеспечивают системы автоматического контроля и управления технологическими процессами?", "a": "Все ответы верны"}, {"q": "Что предусматривается для быстрого отключения подачи мазута в случае аварии или пожара на мазутопроводах?", "a": "устанавливается запорная арматура, расположенная в доступных для обслуживания местах;"}, {"q": "Что применяют для защиты внутренних поверхностей стальных резервуаров с нефтью и нефтепродуктами от коррозии?", "a": "Что следует делать оператору перед началом слива нефтепродуктов , - все ответы верны"}, {"q": "Что создается для контроля уровня и состава подземных вод на накопителе отходов и сточных вод хвостохранилища?", "a": "сеть наблюдательных скважин;"}, {"q": "Что такое взрывопожароопасный объект?", "a": "объект, осуществляющий деятельность, в процессе которой обращаются (производится, хранятся, транспортируется, утилизируются) сжиженные углеводородные газы, легковоспламеняющиеся жидкости, твердые горючие и трудногорючие вещества и материалы, вещества и материалы, способные гореть при взаимодействии с водой, кислородом воздуха и друг с другом в количестве, достаточном при их воспламенении создать угрозу жизни и здоровью людей, а также окружающей среде."}, {"q": "Что такое технологический процесс?", "a": "часть производственного процесса, содержащая целенаправленные действия по изменению и (или) определению состояния предмета труда."}, {"q": "Что такое технологическое оборудование?", "a": "машины, аппараты и установки, производящие промышленную продукцию и осуществляющие автоматическое управление технологическими процессами."}, {"q": "Что является одной из задач производственного контроля в области промышленной безопасности?", "a": "выявление обстоятельств и причин нарушений, влияющих на состояние безопасности производства работ; обеспечение выполнения требований промышленной безопасности на опасных производственных объектах."}, {"q": "Ширина или диаметр смотрового отверстия двери шахты?", "a": "От 50 до 120 мм"}, {"q": "Ширина свободного прохода площадок должна составлять?", "a": "не менее 600 мм, а для обслуживания арматуры, контрольно-измерительных приборов и другого оборудования – не менее 800 мм;"}, {"q": "Экспертизе промышленной безопасности подлежат?", "a": "все ответы верны. эксплуатации сосуды в зависимости от назначения оснащаются: … запорной или запорно-регулирующей арматурой; приборами для измерения"}, {"q": "эксплуатации сосуды в зависимости от назначения оснащаются:", "a": "давления; приборами для измерения температуры; предохранительными устройствами; указателями уровня жидкости;"}, {"q": "Эффективность работы установок электрохимической защиты проверяется не реже?", "a": "1 раза в шесть месяцев"}];

let questions=[],idx=0,score=0,wrong=[],answered=false;

function start(){let n=document.getElementById('count').value;questions=document.getElementById('order').value==='original'?[...BANK]:shuffle(BANK);if(n!=='all')questions=questions.slice(0,Number(n));idx=0;score=0;wrong=[];document.getElementById('setup').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');render()}
function render(){answered=false;let item=questions[idx];document.getElementById('progress').textContent=`Вопрос ${idx+1} из ${questions.length}`;document.getElementById('scoreLive').textContent=`Верно: ${score}`;document.getElementById('fill').style.width=(idx/questions.length*100)+'%';document.getElementById('qtext').textContent=item.q;document.getElementById('feedback').style.display='none';document.getElementById('feedback').textContent='';document.getElementById('check').disabled=false;document.getElementById('next').disabled=true;document.getElementById('next').textContent=idx===questions.length-1?'Завершить тест':'Следующий вопрос →';
let distractors=shuffle(BANK.filter(x=>x.a&&x.a!==item.a).map(x=>x.a));let opts=shuffle([item.a,...distractors.slice(0,3)]);document.getElementById('opts').innerHTML=opts.map((a,i)=>`<label class="option"><input type="radio" name="answer" value="${i}"><span>${escapeHtml(a)}</span></label>`).join('')}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function checkAnswer(){if(answered)return;let chosen=document.querySelector('input[name=answer]:checked');if(!chosen){alert('Выберите вариант ответа.');return}answered=true;let item=questions[idx],labels=[...document.querySelectorAll('.option')],correct=labels.findIndex(l=>l.textContent.trim()===item.a);labels.forEach((l,i)=>{l.querySelector('input').disabled=true;if(i===correct)l.classList.add('correct')});let ok=labels[Number(chosen.value)].textContent.trim()===item.a;if(ok)score++;else{labels[Number(chosen.value)].classList.add('wrong');wrong.push(item)}let f=document.getElementById('feedback');f.style.display='block';f.textContent=ok?'Верно!':`Неверно. Правильный ответ: ${item.a}`;document.getElementById('check').disabled=true;document.getElementById('next').disabled=false;document.getElementById('scoreLive').textContent=`Верно: ${score}`}
function nextQuestion(){if(idx<questions.length-1){idx++;render()}else finish()}
function finish(){document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');document.getElementById('resultTitle').textContent=`Результат: ${score} из ${questions.length}`;document.getElementById('resultText').textContent=`Ошибок: ${wrong.length}. ${Math.round(score/questions.length*100)}% правильных ответов.`;document.getElementById('errors').innerHTML=''}
function review(){let e=document.getElementById('errors');e.innerHTML=wrong.length?'<h3>Вопросы для повторения</h3>'+wrong.map((x,i)=>`<p><b>${i+1}. ${escapeHtml(x.q)}</b><br><span class="small">Ответ: ${escapeHtml(x.a)}</span></p>`).join(''):'Ошибок нет — отлично!'}
</script></body></html>
